# Dev profile: backend API + infra + monitoring.
#
#   docker compose up -d --build
#   curl http://localhost:3001/health/ready
#
# Frontend runs separately from `frontend/`:
#   cd ../frontend && docker compose up -d --build
#
# App overrides DB/Redis/RabbitMQ hosts via compose `environment` (docker network names).
# Secrets and API keys still come from `.env`.

x-app-healthcheck: &app-healthcheck
  test:
    [
      'CMD',
      'node',
      '-e',
      "require('http').get('http://localhost:3001/health/ready', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))",
    ]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s

services:
  app:
    container_name: max-airline-app-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    env_file:
      - .env
    environment:
      NODE_ENV: development
      HTTP_PORT: 3001
      HTTP_HOST: 0.0.0.0
      APP_HOST: http://localhost:3001
      APP_URL: ${APP_URL:-http://localhost}
      HTTP_CORS: ${HTTP_CORS:-http://localhost,http://localhost:80,http://localhost:3111}
      VK_REDIRECT_URI: ${VK_REDIRECT_URI:-http://localhost}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RABBITMQ_URI: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin}@rabbitmq:5672
      RABBITMQ_CONNECTION_WAIT: 'false'
      KAFKA_BROKERS: redpanda:9092
      KAFKA_AUDIT_CONSUMER_GROUP: booking-audit
      KAFKA_NOTIFICATIONS_CONSUMER_GROUP: booking-notifications
      KAFKA_ANALYTICS_CONSUMER_GROUP: booking-analytics
      KAFKA_DOMAIN_TOPICS: booking.created,booking.expired,booking.paid,booking.canceled,booking.ticketing.failed,ticket.issued,payment.failed,payment.reconciliation.refunded,flight.delayed,flight.cancelled
      # Internal: app container → MinIO on Docker network
      S3_ENDPOINT: http://minio:9000
      # Public: host in browser presigned URLs (compose MinIO port map).
      # Do not reuse cloud S3_PUBLIC_ENDPOINT from .env here — uploads use MinIO keys.
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-my-tickets}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
      S3_FORCE_PATH_STYLE: 'true'
      SEED_DEMO: ${SEED_DEMO:-false}
    ports:
      - '127.0.0.1:3001:3001'
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - backend
    healthcheck:
      <<: *app-healthcheck
      start_period: 300s

  postgres:
    image: postgres:16-alpine
    container_name: max-airline-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=en_US.UTF-8
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: max-airline-redis-dev
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD}
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  minio:
    image: minio/minio:latest
    container_name: minio-dev
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_HOST: minio
      MINIO_PORT: '9000'
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
      S3_BUCKET: ${S3_BUCKET:-my-tickets}
    volumes:
      - ./scripts/docker/minio-init.sh:/minio-init.sh:ro
    entrypoint: ['/bin/sh', '/minio-init.sh']
    restart: 'no'
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-dev
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin}
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  redpanda:
    image: redpandadata/redpanda:v24.2.2
    container_name: redpanda-dev
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --mode dev-container
      - --smp 1
      - --memory 512M
    ports:
      - '127.0.0.1:19092:19092'
    healthcheck:
      test: ['CMD', 'rpk', 'cluster', 'health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    ports:
      - '127.0.0.1:9187:9187'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: redis-exporter
    command:
      - --redis.addr=redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - '127.0.0.1:9121:9121'
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - '127.0.0.1:9090:9090'
    depends_on:
      app:
        condition: service_healthy
      postgres-exporter:
        condition: service_started
      redis-exporter:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana-dev
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: '%(protocol)s://%(domain)s:%(http_port)s/'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    ports:
      - '127.0.0.1:3002:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
  redis_data:
  minio_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  node_modules:
