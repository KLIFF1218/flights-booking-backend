global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'postgres'
    static_configs:
      - targets:
          - 'postgres-exporter:9187'

  - job_name: 'redis'
    static_configs:
      - targets:
          - 'redis-exporter:9121'

  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'prometheus:9090'

  - job_name: 'max-airline'
    static_configs:
      - targets:
          - 'app:3001'
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 5s
