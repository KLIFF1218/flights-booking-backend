x-app-healthcheck: &app-healthcheck
  test:
    [
      'CMD',
      'node',
      '-e',
      "require('http').get('http://localhost:3001/health/ready', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))",
    ]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 90s

services:
  app:
    # Docker image refs must be lowercase (ghcr.io rejects uppercase owner names).
    image: ghcr.io/${GITHUB_REPOSITORY:-kliff1218/max-airline}:${APP_VERSION:-latest}
    container_name: max-airline-app-prod
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HTTP_PORT: 3001
      HTTP_HOST: 0.0.0.0
      APP_URL: ${APP_URL:-http://localhost}
      HTTP_CORS: ${HTTP_CORS:-http://localhost,http://localhost:80,http://localhost:3111}
      VK_REDIRECT_URI: ${VK_REDIRECT_URI:-http://localhost}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RABBITMQ_URI: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      RABBITMQ_CONNECTION_WAIT: 'true'
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
    healthcheck: *app-healthcheck
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16-alpine
    container_name: max-airline-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=en_US.UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/backups:/backups
    ports:
      # Host 5433 avoids clash with local Windows PostgreSQL on 5432 (same as dev compose).
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: max-airline-redis-prod
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MEMORY:-512mb}
      --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD}
      --loglevel notice
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-prod
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: postgres-exporter-prod
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    ports:
      - '127.0.0.1:9187:9187'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: redis-exporter-prod
    command:
      - --redis.addr=redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - '127.0.0.1:9121:9121'
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus-prod
    volumes:
      - ./prometheus.production.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - '127.0.0.1:9090:9090'
    depends_on:
      app:
        condition: service_healthy
      postgres-exporter:
        condition: service_started
      redis-exporter:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana-prod
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change_me}
      GF_SERVER_ROOT_URL: '%(protocol)s://%(domain)s:%(http_port)s/'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    ports:
      - '127.0.0.1:3002:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
