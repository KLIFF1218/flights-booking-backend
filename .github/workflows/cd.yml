name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy to production
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE: ghcr.io/${{ github.repository }}:latest
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: IMAGE,GHCR_PULL_TOKEN
          script: |
            set -euo pipefail
            cd /var/www/max-airline
            export GITHUB_REPOSITORY="${{ github.repository }}"
            export APP_VERSION=latest

            if [ -n "${GHCR_PULL_TOKEN:-}" ]; then
              echo "> Logging in to GHCR..."
              echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
            fi

            echo "> Pulling ${IMAGE}..."
            docker pull "${IMAGE}"

            echo "> Restarting containers (migrations run via app entrypoint)..."
            docker compose -f docker-compose.production.yml up -d --pull always --remove-orphans

            echo "> Cleaning up old images..."
            docker image prune -f

            echo "> Deployment complete!"
